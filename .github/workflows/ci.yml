name: CI

# Run only on pull requests targeting main.
# Push to main is omitted -- CI already ran on the PR before merge,
# so re-running on push is a duplicate that costs extra minutes.
on:
  pull_request:
    branches: ["main"]
    # Only run when source code or dependencies change.
    # Skips CI for docs, config, or workflow-only changes.
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"

# Cancel any in-progress run for the same PR branch when a new commit is pushed.
# Prevents paying for stale runs that are no longer relevant.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to match the opencv5.pc the crate is developed against (see CLAUDE.md).
  # ubuntu-latest's apt repos only ship OpenCV 4.x, so core OpenCV is built from
  # source here (contrib modules are not needed -- Cargo.toml only enables
  # video/videoio/imgproc/imgcodecs/highgui). Cached by this version + runner OS;
  # bump OPENCV_VERSION to force a rebuild if the pin changes.
  OPENCV_VERSION: "5.0.0"

jobs:
  ci:
    name: Lint and Build
    runs-on: ubuntu-latest
    # Least-privilege: only read access to the repository contents is needed.
    permissions:
      contents: read
    steps:
      # Check out the repository so subsequent steps have access to the source.
      - name: Checkout code
        uses: actions/checkout@v7

      # cpal (audio capture) links against ALSA at build time regardless of
      # whether OpenCV is cached, so this runs unconditionally on every run.
      - name: Install runtime linkage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev

      - name: Cache OpenCV build
        id: cache-opencv
        uses: actions/cache@v4
        with:
          path: /usr/local/opencv
          key: opencv-${{ env.OPENCV_VERSION }}-${{ runner.os }}-core

      # Only needed on a cache miss -- most runs restore the cache above instead.
      - name: Install OpenCV build dependencies
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git pkg-config \
            libgtk-3-dev libavcodec-dev libavformat-dev libswscale-dev \
            libv4l-dev libjpeg-dev libpng-dev libtiff-dev

      - name: Build OpenCV ${{ env.OPENCV_VERSION }} from source
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          git clone --branch "$OPENCV_VERSION" --depth 1 https://github.com/opencv/opencv.git /tmp/opencv
          cmake -S /tmp/opencv -B /tmp/opencv/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local/opencv \
            -DBUILD_LIST=core,imgproc,imgcodecs,videoio,highgui,video \
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF \
            -DBUILD_opencv_apps=OFF -DBUILD_DOCS=OFF
          cmake --build /tmp/opencv/build --parallel "$(nproc)"
          sudo cmake --install /tmp/opencv/build

      - name: Point pkg-config at the cached/built OpenCV
        run: |
          echo "PKG_CONFIG_PATH=/usr/local/opencv/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/opencv/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

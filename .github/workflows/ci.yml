name: CI

# Runs on pull requests targeting main, plus pushes to main.
#
# The push-to-main trigger is NOT a redundant re-run of the PR's CI -- its job is to
# warm the OpenCV/cargo actions/cache entries in main's cache scope. GitHub Actions
# scopes a saved cache to the branch it was created on (falling back to the base
# branch), so a cache saved on a PR branch is invisible to any *other* PR branch and
# is lost once that branch is deleted at merge. Since this repo never ran anything on
# main, every PR was building OpenCV from source from an always-cold cache. Pushing
# to main after each merge means the next PR (branched from up-to-date main) can
# actually restore a warm cache instead of rebuilding.
on:
  pull_request:
    branches: ["main"]
    # Only run when source code, dependencies, or this workflow itself change.
    # Skips CI for docs/config changes, but still runs on workflow edits so
    # this file can be validated (and, on push, so main's caches stay warm).
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"
  push:
    branches: ["main"]
    paths:
      - "src/**"
      - "Cargo.toml"
      - "Cargo.lock"
      - ".github/workflows/ci.yml"

# Cancel any in-progress run for the same PR branch when a new commit is pushed.
# Prevents paying for stale runs that are no longer relevant. Keyed by event name as
# well as ref so that a push-to-main run (which exists solely to warm the cache) is
# never cancelled by a later, unrelated push -- cancelling it mid-run would kill its
# cache-save step before it completes, silently defeating the point of running it.
concurrency:
  group: ci-${{ github.event_name }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Pinned to match the opencv5.pc the crate is developed against.
  # ubuntu-latest's apt repos only ship OpenCV 4.x, so core OpenCV is built from
  # source here (contrib modules are not needed -- Cargo.toml only enables
  # video/videoio/imgproc/imgcodecs/highgui). Cached by this version + runner OS;
  # bump OPENCV_VERSION to force a rebuild if the pin changes.
  OPENCV_VERSION: "5.0.0"

jobs:
  ci:
    name: Lint and Build
    runs-on: ubuntu-latest
    # Least-privilege: only read access to the repository contents is needed.
    permissions:
      contents: read
    steps:
      # Check out the repository so subsequent steps have access to the source.
      - name: Checkout code
        uses: actions/checkout@v7

      # cpal (audio capture) links against ALSA at build time regardless of
      # whether OpenCV is cached, so this runs unconditionally on every run.
      # ffmpeg is also unconditional here: it's a hard runtime dependency (see
      # ADR 5) and the recorder integration tests spawn it for real, so it
      # must be present even on a cache-hit run where OpenCV needs nothing.
      - name: Install runtime linkage dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends libasound2-dev ffmpeg

      # actions/cache's restore step extracts the tarball as the unprivileged runner
      # user (no sudo), but /usr/local is root-owned -- without this, every restore
      # silently fails with "Cannot mkdir: Permission denied" on every file, leaving
      # cache-hit reported as true while /usr/local/opencv ends up empty, so the build
      # step below still ends up compiling from source on every run regardless of
      # cache state. Pre-creating and chowning the directory to the runner user is
      # what makes the tar extraction actually land.
      - name: Prepare OpenCV install directory
        run: |
          sudo mkdir -p /usr/local/opencv
          sudo chown "$(id -u):$(id -g)" /usr/local/opencv

      - name: Cache OpenCV build
        id: cache-opencv
        uses: actions/cache@v6
        with:
          path: /usr/local/opencv
          key: opencv-${{ env.OPENCV_VERSION }}-${{ runner.os }}-core
          restore-keys: |
            opencv-${{ env.OPENCV_VERSION }}-${{ runner.os }}-

      # Only needed on a cache miss -- most runs restore the cache above instead.
      - name: Install OpenCV build dependencies
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake git pkg-config \
            libgtk-3-dev libavcodec-dev libavformat-dev libswscale-dev \
            libv4l-dev libjpeg-dev libpng-dev libtiff-dev

      - name: Build OpenCV ${{ env.OPENCV_VERSION }} from source
        if: steps.cache-opencv.outputs.cache-hit != 'true'
        run: |
          git clone --branch "$OPENCV_VERSION" --depth 1 https://github.com/opencv/opencv.git /tmp/opencv
          cmake -S /tmp/opencv -B /tmp/opencv/build \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_INSTALL_PREFIX=/usr/local/opencv \
            -DBUILD_LIST=core,imgproc,imgcodecs,videoio,highgui,video \
            -DBUILD_EXAMPLES=OFF -DBUILD_TESTS=OFF -DBUILD_PERF_TESTS=OFF \
            -DBUILD_opencv_apps=OFF -DBUILD_DOCS=OFF
          cmake --build /tmp/opencv/build --parallel "$(nproc)"
          sudo cmake --install /tmp/opencv/build
          # Installing as root would flip /usr/local/opencv's ownership back to root,
          # breaking the unprivileged tar extraction the next run's cache restore
          # needs -- reclaim it for the runner user before the cache-save step runs.
          sudo chown -R "$(id -u):$(id -g)" /usr/local/opencv

      - name: Point pkg-config at the cached/built OpenCV
        run: |
          echo "PKG_CONFIG_PATH=/usr/local/opencv/lib/pkgconfig:$PKG_CONFIG_PATH" >> "$GITHUB_ENV"
          echo "LD_LIBRARY_PATH=/usr/local/opencv/lib:$LD_LIBRARY_PATH" >> "$GITHUB_ENV"

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt, llvm-tools-preview

      # cargo-llvm-cov is only needed on PR runs (see the coverage step below),
      # but installing it unconditionally keeps this step's cache key stable and
      # avoids conditional-install cache-key churn.
      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: cargo-${{ runner.os }}-${{ hashFiles('Cargo.lock') }}
          restore-keys: |
            cargo-${{ runner.os }}-

      # Skipped on push-to-main: that run's only job is warming the caches above for
      # the next PR (see the `on:` comment) -- the code was already fully validated
      # by the PR's own pull_request-triggered run before it was merged, so fmt/clippy
      # add nothing here. `cargo build` below still runs on both triggers, since it's
      # what actually populates the cargo cache this job exists to warm on push.
      - name: Check formatting
        if: github.event_name == 'pull_request'
        run: cargo fmt --all -- --check

      - name: Run clippy
        if: github.event_name == 'pull_request'
        run: cargo clippy --all-targets -- -D warnings

      - name: Build
        run: cargo build --all-targets

      # 9 tests across detect.rs/main.rs are #[ignore]d: they construct a real
      # Detector (ONNX Runtime session) against models/yolov8n.onnx, which is
      # gitignored and not fetched here, so everything else runs. Coverage (not
      # just pass/fail) is measured by the step below instead of a plain
      # `cargo test`, since llvm-cov's instrumented run already re-runs the
      # full suite; a bare `cargo test` here would just duplicate that work.
      #
      # coverage_excluded.rs/preview.rs are excluded by file: they need real
      # camera/audio hardware or a display, which CI (and this repo's
      # stable-only toolchain, which can't use the nightly-only
      # #[coverage(off)] attribute for finer-grained exclusion) cannot
      # provide. capture/camera.rs and capture/audio.rs themselves are
      # deliberately not in this list (held to real 100%; their hardware-bound
      # functions live in capture/camera_coverage_excluded.rs and
      # capture/audio_coverage_excluded.rs, matched by the coverage_excluded.rs
      # pattern above); see docs/adr/0006-coverage-exclusions.md for why and
      # for the per-file reasoning behind this whole list.
      #
      # 77% (not the ~95.8% achievable locally with the model file present)
      # is what CI can actually reach without the #[ignore]'d tests; set from
      # the real measured number (77.28%) with a small margin so measurement
      # noise doesn't fail unrelated PRs. Recalibrated down from 78% here:
      # main.rs's try_start_recording buffer-not-ready branch used to call
      # poll_confirmed_detections with a skip_inference flag (a branch the
      # non-ignored suite could reach); that branch was refactored to call
      # expire_stale_pending directly instead, so it is now only exercised
      # by an #[ignore]'d test requiring a real Detector/ONNX session,
      # lowering the CI-reachable ceiling by about a point. Recalibrate this
      # number (in either direction) whenever code moves across the
      # testable/untestable boundary; see
      # docs/adr/0006-coverage-exclusions.md for the move-untestable-code-
      # to-its-own-file convention this project uses to raise the ceiling
      # over time. Never lower it to silence an otherwise-unexplained
      # regression.
      - name: Run tests with coverage
        if: github.event_name == 'pull_request'
        run: cargo llvm-cov --workspace --fail-under-lines 77 --ignore-filename-regex 'coverage_excluded\.rs|preview\.rs'

---
name: PR Title Lint

# Enforces that PR titles follow Conventional Commits. This repo squash-merges
# PRs, and GitHub defaults the squash commit message to the PR title, so the
# PR title is what release-please actually reads on main, not the individual
# commits inside the PR. A PR mixing commit types (e.g. mostly refactor: with
# one feat: buried inside) must be titled with the most significant type
# present (feat > fix > everything else), or that release-worthy change is
# silently invisible to release-please after squash.
#
# Uses pull_request rather than pull_request_target: all contributors here
# have write access to the repo (no public fork PRs to support), so the
# elevated base-repo privileges pull_request_target grants aren't needed and
# would only add blast radius if this third-party action were compromised.
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize

permissions:
  pull-requests: read

jobs:
  lint-pr-title:
    runs-on: ubuntu-latest
    steps:
      - uses: amannn/action-semantic-pull-request@v6
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

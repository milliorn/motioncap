name: Release

# Run on every push to main. release-please itself decides whether that push
# means "update the pending release PR" or "a release PR was just merged, cut
# the release" -- no paths filter, since a commit's Conventional Commits type
# (not which files changed) is what release-please uses to decide.
on:
  push:
    branches:
      - main

permissions:
  contents: write
  issues: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

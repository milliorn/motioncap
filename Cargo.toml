[package]
name = "motioncap"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
clap = { version = "4.6.4", features = ["derive"] }
cpal = "0.18.1"
crossbeam-channel = "0.5.16"
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "rayon"] }
nokhwa = { version = "0.10.11", features = ["input-v4l", "decoding"] }
opencv = { version = "0.99.0", default-features = false, features = ["clang-runtime", "video", "videoio", "imgproc", "imgcodecs", "highgui"] }
ort = { version = "2.0.0-rc.12", features = ["cuda", "load-dynamic", "ndarray", "openvino", "rocm"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
